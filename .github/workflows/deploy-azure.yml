name: Deploy to Azure Container Apps

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  API_IMAGE_NAME: pcm-api
  WEB_IMAGE_NAME: pcm-web

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set image tags
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"
          LOGIN_SERVER="${{ secrets.ACR_LOGIN_SERVER }}"
          echo "tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "api_image=${LOGIN_SERVER}/${API_IMAGE_NAME}:${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "web_image=${LOGIN_SERVER}/${WEB_IMAGE_NAME}:${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "api_latest=${LOGIN_SERVER}/${API_IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"
          echo "web_latest=${LOGIN_SERVER}/${WEB_IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"

      - name: Login to ACR
        run: az acr login --name "${{ secrets.ACR_NAME }}"

      - name: Build and push API image
        run: |
          docker build -f Dockerfile.api \
            -t "${{ steps.meta.outputs.api_image }}" \
            -t "${{ steps.meta.outputs.api_latest }}" \
            .
          docker push "${{ steps.meta.outputs.api_image }}"
          docker push "${{ steps.meta.outputs.api_latest }}"

      - name: Build and push Web image
        run: |
          docker build -f Dockerfile.web \
            -t "${{ steps.meta.outputs.web_image }}" \
            -t "${{ steps.meta.outputs.web_latest }}" \
            .
          docker push "${{ steps.meta.outputs.web_image }}"
          docker push "${{ steps.meta.outputs.web_latest }}"

      - name: Ensure platform + Container Apps
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JUMPHOST_ADMIN_PASSWORD: ${{ secrets.JUMPHOST_ADMIN_PASSWORD }}
          JUMPHOST_RDP_CIDR: ${{ secrets.JUMPHOST_RDP_CIDR }}
          JUMPHOST_ADMIN_USERNAME: ${{ secrets.JUMPHOST_ADMIN_USERNAME }}
        run: |
          set -euo pipefail
          RG="${{ secrets.AZURE_RESOURCE_GROUP }}"
          ACR="${{ secrets.ACR_NAME }}"
          LOC="${{ secrets.AZURE_LOCATION }}"
          API_IMG="${{ steps.meta.outputs.api_image }}"
          WEB_IMG="${{ steps.meta.outputs.web_image }}"
          JUMP_USER="${JUMPHOST_ADMIN_USERNAME:-pcmadmin}"

          if [[ -z "${JUMPHOST_ADMIN_PASSWORD:-}" || -z "${JUMPHOST_RDP_CIDR:-}" ]]; then
            echo "JUMPHOST_ADMIN_PASSWORD and JUMPHOST_RDP_CIDR secrets are required for VNet/jumphost."
            exit 1
          fi

          write_platform_params() {
            jq -n \
              --arg loc "$LOC" \
              --arg user "$JUMP_USER" \
              --arg pass "$JUMPHOST_ADMIN_PASSWORD" \
              --arg cidr "$JUMPHOST_RDP_CIDR" \
              '{
                "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
                "contentVersion": "1.0.0.0",
                "parameters": {
                  "location": { "value": $loc },
                  "jumpHostAdminUsername": { "value": $user },
                  "jumpHostAdminPassword": { "value": $pass },
                  "jumpHostRdpSourceCidr": { "value": $cidr }
                }
              }' > /tmp/pcm-platform.parameters.json
          }

          # Idempotent: create/update VNet + Windows jumphost
          if ! az vm show --name pcm-jump --resource-group "$RG" &>/dev/null; then
            echo "Deploying VNet + Windows jumphost..."
            write_platform_params
            az deployment group create \
              --resource-group "$RG" \
              --template-file infra/platform.bicep \
              --parameters /tmp/pcm-platform.parameters.json
          else
            echo "Jumphost pcm-jump already exists — skipping platform create."
          fi

          if ! az containerapp show --name pcm-api --resource-group "$RG" &>/dev/null; then
            echo "First-time deploy: creating Container Apps via Bicep..."
            jq -n \
              --arg acr "$ACR" \
              --arg loc "$LOC" \
              --arg api "$API_IMG" \
              --arg web "$WEB_IMG" \
              --arg db "$DATABASE_URL" \
              --arg user "$JUMP_USER" \
              --arg pass "$JUMPHOST_ADMIN_PASSWORD" \
              --arg cidr "$JUMPHOST_RDP_CIDR" \
              '{
                "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
                "contentVersion": "1.0.0.0",
                "parameters": {
                  "acrName": { "value": $acr },
                  "location": { "value": $loc },
                  "apiImage": { "value": $api },
                  "webImage": { "value": $web },
                  "databaseUrl": { "value": $db },
                  "deployPlatform": { "value": false },
                  "jumpHostAdminUsername": { "value": $user },
                  "jumpHostAdminPassword": { "value": $pass },
                  "jumpHostRdpSourceCidr": { "value": $cidr }
                }
              }' > /tmp/pcm.parameters.json

            az deployment group create \
              --resource-group "$RG" \
              --template-file infra/main.bicep \
              --parameters /tmp/pcm.parameters.json
          else
            echo "Container Apps already exist — updating images..."
            az containerapp update \
              --name pcm-api \
              --resource-group "$RG" \
              --image "$API_IMG"
            az containerapp update \
              --name pcm-web \
              --resource-group "$RG" \
              --image "$WEB_IMG"
          fi

          if az vm show --name pcm-jump --resource-group "$RG" &>/dev/null; then
            JUMP_IP=$(az vm list-ip-addresses -g "$RG" -n pcm-jump \
              --query "[0].virtualMachine.network.publicIpAddresses[0].ipAddress" -o tsv)
            echo "Jumphost RDP: mstsc /v:${JUMP_IP} (user ${JUMP_USER})"
          fi

      - name: Print web URL
        run: |
          FQDN=$(az containerapp show \
            --name pcm-web \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "Deployed web app: https://${FQDN}"
