name: Diagnose pcm-api
on:
  workflow_dispatch:
    inputs:
      fix_revision:
        description: 'If true, update pcm-api-cont + pcm-web-cont to current :latest digests'
        required: false
        default: 'false'
permissions:
  id-token: write
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Inspect failed revision and optionally redeploy
        run: |
          set -euo pipefail
          RG="${{ secrets.AZURE_RESOURCE_GROUP }}"
          echo "=== revision details ==="
          az containerapp revision list -n pcm-api-cont -g "$RG" -o json > /tmp/revs.json
          python3 - <<'PY'
          import json
          revs=json.load(open('/tmp/revs.json'))
          for r in revs:
            p=r.get('properties') or {}
            print('---', r.get('name'))
            print(' active=', p.get('active'), 'runningState=', p.get('runningState'), 'healthState=', p.get('healthState'), 'traffic=', p.get('trafficWeight'))
            print(' created=', p.get('createdTime'), 'image=', ((p.get('template') or {}).get('containers') or [{}])[0].get('image'))
            print(' provisioning=', p.get('provisioningState'), 'replicas=', p.get('replicas'))
            err=p.get('runningStateDetails') or p.get('healthStateDetails') or p.get('provisioningError')
            if err: print(' details=', err)
          PY
          echo "=== system logs (activation) ==="
          az containerapp logs show -n pcm-api-cont -g "$RG" --type system --tail 80 2>&1 || true
          echo "=== console logs ==="
          az containerapp logs show -n pcm-api-cont -g "$RG" --tail 80 2>&1 || true
          if [ "${{ github.event.inputs.fix_revision }}" = "true" ]; then
            echo "=== forcing new revision from :latest ==="
            # digest-pin latest so ACA actually creates a new revision even if tag string unchanged
            DIGEST=$(az acr manifest show-metadata -r acrpcmtt -n pcm-api:latest --query digest -o tsv)
            WEB_DIGEST=$(az acr manifest show-metadata -r acrpcmtt -n pcm-web:latest --query digest -o tsv)
            echo "api digest=$DIGEST"
            echo "web digest=$WEB_DIGEST"
            az containerapp update -n pcm-api-cont -g "$RG" --image "acrpcmtt.azurecr.io/pcm-api@${DIGEST}" -o table
            az containerapp update -n pcm-web-cont -g "$RG" --image "acrpcmtt.azurecr.io/pcm-web@${WEB_DIGEST}" -o table
            sleep 20
            az containerapp revision list -n pcm-api-cont -g "$RG" --query "[].{name:name,active:properties.active,running:properties.runningState,traffic:properties.trafficWeight,image:properties.template.containers[0].image}" -o table
            WEB=$(az containerapp show -n pcm-web-cont -g "$RG" --query "properties.configuration.ingress.fqdn" -o tsv)
            echo "WEB=$WEB"
            curl -sS -o /tmp/prism-config.json -w "config HTTP %{http_code}\n" "https://$WEB/api/prism/config" || true
            cat /tmp/prism-config.json; echo
            curl -sS -o /tmp/prism-ping.json -w "ping HTTP %{http_code}\n" "https://$WEB/api/prism/ping" || true
            cat /tmp/prism-ping.json; echo
          fi
